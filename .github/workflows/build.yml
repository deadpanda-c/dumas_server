name: build

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install CMake 4.3
        run: |
          sudo apt-get update
          sudo apt-get purge --auto-remove cmake
          sudo apt-get install -y wget
          wget https://github.com/Kitware/CMake/releases/download/v4.3.0/cmake-4.3.0-linux-x86_64.sh
          sudo mkdir /opt/cmake
          sudo sh cmake-4.3.0-linux-x86_64.sh --skip-license --prefix=/opt/cmake
          echo "/opt/cmake/bin" >> $GITHUB_PATH
          cmake --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build
